name: Release Please & Publish Multi-Arch Container

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

permissions:
  contents: write        # Necessário para criar tags Git, releases e commitar changelog
  pull-requests: write   # Necessário para abrir e atualizar o Release PR
  packages: write        # Necessário para fazer o push da imagem conteinerizada no GHCR

jobs:
  release-please:
    name: 🤖 Google Release Please (SemVer & Changelog)
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: 🚀 Executar Release Please Engine
        id: release
        uses: googleapis/release-please-action@v4
        with:
          release-type: simple

  verify:
    name: 1. Verify source
    runs-on: ubuntu-latest
    needs: [release-please]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Download Go modules
        run: go mod download

      - name: Run Go tests
        run: go test ./...

      - name: Validate Compose files
        run: |
          docker compose --env-file example.env -f docker-compose-dev.yaml config >/dev/null
          docker compose --env-file example.env -f docker-compose-monolito-dev.yaml config >/dev/null
          docker compose --env-file example.env -f docker-compose-monolito-prod.yaml config >/dev/null
          docker compose --env-file example.env -f docker-compose-prod.yaml config >/dev/null

  build-and-scan:
    name: 2. Build and scan Docker images
    runs-on: ubuntu-latest
    needs: [release-please, verify]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - image_name: monolito
            dockerfile: monolito/Dockerfile
          - image_name: api
            dockerfile: desacoplado/backend/Dockerfile
          - image_name: frontend
            dockerfile: desacoplado/frontend/Dockerfile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Build local image
        run: docker build -f ${{ matrix.dockerfile }} -t gotodolist-${{ matrix.image_name }}:scan .

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: gotodolist-${{ matrix.image_name }}:scan
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: HIGH,CRITICAL

  build-and-push:
    name: 3. Build and push Docker images
    runs-on: ubuntu-latest
    needs: [release-please, verify, build-and-scan]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - image_name: monolito
            dockerfile: monolito/Dockerfile
          - image_name: api
            dockerfile: desacoplado/backend/Dockerfile
          - image_name: frontend
            dockerfile: desacoplado/frontend/Dockerfile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: |
            APP_VERSION=${{ needs.release-please.outputs.tag_name }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.image_name }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.image_name }}:${{ needs.release-please.outputs.tag_name }}
